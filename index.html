<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #bbdefb, #e3f2fd);
      color: #333;
    }
    header, footer {
      background: #1565c0;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 0 0 20px 20px;
    }
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    form {
      background: #ffffffcc;
      backdrop-filter: blur(6px);
      padding: 25px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      position: relative;
    }
    h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #444;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      background: #e3f2fd;
      color: #333;
    }
    input:focus {
      outline: none;
      border-color: #1565c0;
      box-shadow: 0 0 8px #1565c0;
    }
    
    .color-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #bbdefb;
      padding: 10px;
      border-radius: 12px;
    }
    .color-box input[type="color"] {
      border: none;
      width: 50px;
      height: 40px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 6px #64b5f6;
    }
    .color-box span {
      color: #1565c0;
      font-weight: bold;
    }
    button {
      margin-top: 25px;
      padding: 12px;
      width: 100%;
      background: linear-gradient(90deg, #42a5f5, #64b5f6);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(90deg, #1565c0, #1e88e5);
    }
    .profile-pic {
      display: block;
      margin: 0 auto 15px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #1565c0;
      box-shadow: 0 0 12px #64b5f6;
    }
    
    .success-message {
      display: none;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: #bbdefb;
      color: #1565c0;
      border-radius: 10px;
      font-weight: bold;
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
    @media (max-width: 480px) {
      form {
        padding: 15px;
      }
      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>



  <main>
    <form id="registroForm">
      <h2>Registro de Usuario</h2>

      <img src="usuario.jpg" alt="Imagen de perfil" class="profile-pic">

      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" maxlength="8" required>
      <small style="color:#1565c0;">Debe ser exactamente 8 caracteres</small>

      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha" name="fecha" required>

      <label for="color">Color favorito:</label>
      <div class="color-box">
        <input type="color" id="color" name="color">
        <span>Elige tu color</span>
      </div>


      <label for="pais">País:</label>
      <input list="paises" id="pais" name="pais" placeholder="Escribe o selecciona..." required>
      <datalist id="paises">
        <option value="México">
        <option value="España">
        <option value="Argentina">
        <option value="Colombia">
        <option value="Chile">
        <option value="Estados Unidos">
        <option value="Alemania">
        <option value="Egipto">
        <option value="República Dominicana">
      </datalist>

      <button type="submit">Registrarse</button>

      <div id="successMessage" class="success-message">
        ✅ ¡Registro exitoso!
      </div>
    </form>
  </main>

  <script>
    document.getElementById("registroForm").addEventListener("submit", function(event){
      event.preventDefault();
      const password = document.getElementById("password").value;
      if (password.length !== 8) {
        alert("La contraseña debe tener exactamente 8 caracteres.");
        return false;
      }
      document.getElementById("successMessage").style.display = "block";
      
      
      setTimeout(() => {
        document.getElementById("registroForm").reset();
        document.getElementById("successMessage").style.display = "none";
      }, 2000);
    });
  </script>

</body>
</html>
